<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="BayuF - Frontend &amp; Backend Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonText" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-200 0" to="1000 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bgGrad)"/>
  <rect width="1000" height="300" fill="url(#glowGrad)"/>

  <g fill="#58a6ff">
    <circle cx="120" cy="260" r="2.5">
      <animate attributeName="cy" values="260;150;260" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="80" r="2">
      <animate attributeName="cy" values="80;200;80" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="250" r="3">
      <animate attributeName="cy" values="250;140;250" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="90" r="2">
      <animate attributeName="cy" values="90;210;90" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="40" r="2.5">
      <animate attributeName="cy" values="40;150;40" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.05;0.4" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#1f6feb" font-family="'Consolas', 'Courier New', monospace" font-weight="bold">
    <text x="90" y="120" font-size="34" opacity="0.85">&#123;&#125;
      <animate attributeName="y" values="120;110;120" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="830" y="200" font-size="30" opacity="0.85">&lt;/&gt;
      <animate attributeName="y" values="200;190;200" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="820" y="70" font-size="28" opacity="0.7">&#91; &#93;
      <animate attributeName="y" values="70;62;70" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="220" font-size="28" opacity="0.7">*_*
      <animate attributeName="y" values="220;212;220" dur="4.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="500" y="152" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="800" fill="url(#neonText)" filter="url(#glow)">BayuF</text>

  <text x="500" y="205" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="20" fill="#8b949e">Frontend &amp; Backend Developer</text>
  <text x="500" y="232" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="15" fill="#4b5563">laravel · react · javascript · php · mysql</text>

  <line x1="300" y1="270" x2="700" y2="270" stroke="url(#neonText)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </line>
</svg>
