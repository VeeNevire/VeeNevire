<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dividerGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-900 0" to="900 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="6" x2="900" y2="6" stroke="url(#dividerGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
